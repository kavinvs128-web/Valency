<svg width="100%" viewBox="90 90 500 220" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Valency logo</title>
  <desc>Logo for Valency chemistry learning platform</desc>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&amp;display=swap');
    .wordmark { font-family: 'Inter', sans-serif; font-weight: 800; font-size: 52px; letter-spacing: 8px; fill: #f0f6ff; }
    .tagline  { font-family: 'Inter', sans-serif; font-weight: 400; font-size: 13px; letter-spacing: 4px; fill: #5a7fa0; }
  </style>

  <defs>
    <filter id="glow-soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="atom-glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <g transform="translate(340, 155)">
    <path d="M -52,75 A 90,90 0 0,1 52,75"
      fill="none" stroke="#00cfff" stroke-width="1" opacity="0.18"
      stroke-dasharray="3 4"/>
    <line x1="0" y1="6" x2="-60" y2="86"
      stroke="#00cfff" stroke-width="3" stroke-linecap="round"
      opacity="0.85" filter="url(#glow-soft)"/>
    <line x1="0" y1="6" x2="60" y2="86"
      stroke="#00cfff" stroke-width="3" stroke-linecap="round"
      opacity="0.85" filter="url(#glow-soft)"/>
    <line x1="-18" y1="30" x2="-28" y2="22"
      stroke="#00cfff" stroke-width="1.8" stroke-linecap="round" opacity="0.5"/>
    <line x1="-32" y1="47" x2="-42" y2="39"
      stroke="#00cfff" stroke-width="1.8" stroke-linecap="round" opacity="0.5"/>
    <line x1="18" y1="30" x2="28" y2="22"
      stroke="#00cfff" stroke-width="1.8" stroke-linecap="round" opacity="0.5"/>
    <line x1="32" y1="47" x2="42" y2="39"
      stroke="#00cfff" stroke-width="1.8" stroke-linecap="round" opacity="0.5"/>
    <circle cx="-60" cy="86" r="4.5" fill="#00cfff" opacity="0.7"/>
    <circle cx="60" cy="86" r="4.5" fill="#00cfff" opacity="0.7"/>
    <circle cx="0" cy="0" r="16" fill="none" stroke="#00cfff" stroke-width="1.5" opacity="0.35"/>
    <circle cx="0" cy="0" r="10" fill="#00cfff" filter="url(#atom-glow)" opacity="0.95"/>
    <circle cx="-2.5" cy="-2.5" r="3.5" fill="white" opacity="0.45"/>
  </g>

  <text x="340" y="258" text-anchor="middle" class="wordmark">VALENCY</text>
  <text x="340" y="284" text-anchor="middle" class="tagline">LEARN · BOND · MASTER</text>
</svg>
